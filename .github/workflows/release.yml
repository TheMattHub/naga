name: release

# Fires only when a GitHub release is published, and needs the PyPI trusted publisher that
# is registered at the public flip. Until then it cannot run.
on:
  release:
    types: [published]

jobs:
  # The fast set on the tagged commit, on the Python the publish job builds with: a release is not
  # published from a red commit (this workflow ran no tests before; 0.20.1 was published in 31 s). The full
  # matrix runs on main; this job is the gate on the one commit that ships.
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e . pytest pytest-xdist hypothesis pyyaml jsonschema
      - name: Run the fast set
        run: pytest -q -n auto

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # Pinned to a commit: this job can publish as the project, so a moved ref must not reach it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
