name: docs

# Builds the documentation site on a push to main that touches the docs or the code they are
# generated from and keeps it as an artifact (Actions > the
# run > Artifacts > docs-site; unzip and open index.html).
#
# Publishing to GitHub Pages is the second job, behind a switch that is OFF. It runs only
# when the repository variable DOCS_DEPLOY is "true" (Settings > Secrets and variables >
# Actions > Variables) and Pages has "GitHub Actions" as its source. Nothing in this
# repository sets either: the owner does, when the repository is public.
# A branch of this repository is built once, by its push; a pull request is built only when
# it comes from a fork, whose pushes do not run here.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "nagasim/**"
      - "tools/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "nagasim/**"
      - "tools/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-docs.txt
      - name: Install
        run: pip install -e . -r requirements-docs.txt
      - name: The generated pages (reference, gallery numbers, llms.txt) are the generator's
        run: |
          python tools/gen_engine_docs.py
          git diff --exit-code -- docs
      - name: Build the site (strict, so a broken link or nav entry fails)
        run: mkdocs build --strict
      - name: Keep the built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 30
      - name: Hand the site to the deploy job
        if: vars.DOCS_DEPLOY == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # OFF unless the owner sets the repository variable DOCS_DEPLOY to "true".
    if: vars.DOCS_DEPLOY == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
