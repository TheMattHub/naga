[pytest]
pythonpath = .
testpaths = tests
; -p no:dash: the `dash` package (not ours) registers a pytest plugin that imports
; dash, IPython, jedi and requests into every pytest process, ~0.9 s each (so
; once per xdist worker); blocking a plugin that is not installed is a no-op.
; -p no:hypothesispytest: its collection hook scans every loaded local module for
; constants (~2 s per process, so on EVERY xdist worker); without it the scan is
; paid once, by the first @given test. @given itself does not need the plugin.
addopts = -ra -p no:cacheprovider -p no:dash -p no:hypothesispytest -m "not slow"
xfail_strict = true
; A FutureWarning from our own runs is an error: it is a behaviour change waiting to
; happen, and a warning displayed from the GUI's worker thread is not safe.
filterwarnings =
    error::FutureWarning
markers =
    slow: statistically heavy, subprocess-heavy or process-pool tests, excluded by
        default (run the whole suite with -m "slow or not slow")
; Windows consoles are cp1252 by default and the engine prints emoji;
; run with PYTHONIOENCODING=utf-8 PYTHONUTF8=1 (also set in conftest.py and CI).
;
; Parallel runs: `pytest -n auto` (pytest-xdist) cuts the fast set from ~26s to
; ~17s here and is stable with the offscreen Qt tests. It is deliberately NOT in
; addopts -- `-n` hides live output and makes a single failing test harder to
; read -- so it stays opt-in:
;     pytest -q -n auto                       # fast set, in parallel
; Do NOT use -n for the whole suite: it contains the throughput guard in
; tests/test_smoke_engine.py, which measures entities/second and reads low when
; every core is busy with other workers. Run the whole suite serially:
;     pytest -q -m "slow or not slow"
;
; Coverage:
;     coverage run --branch -m pytest -m "slow or not slow" && coverage report
