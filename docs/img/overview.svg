<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="How the Naga engine is built. You bring a model file, your data and a plant. The engine checks the file against its schema, problem codes and wall checks; runs it as discrete-event, system dynamics and agent-based models on one SimPy clock; turns runs into evidence with replications, scenarios and optimisation; and follows a plant by starting from now, forecasting, scoring and proposing. You get results, pages to share and a twin's answers. It is driven from the command line, from Python or by an agent over MCP.">
<title>How the Naga engine fits together</title>
<style>
.rail{fill:none;stroke:#cfdcde;stroke-width:2}
.flow{fill:none;stroke:#17a2a5;stroke-width:2;stroke-dasharray:7 11;stroke-linecap:round;
      animation:run 1.4s linear infinite}
@keyframes run{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}.dot{display:none}}
</style>
