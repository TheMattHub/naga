<rect x="265.0" y="24" width="150" height="34" rx="17.0" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<text x="340.0" y="46.25" font-size="15" fill="#12343b" font-weight="600" text-anchor="middle">command line</text>
<rect x="425.0" y="24" width="150" height="34" rx="17.0" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<text x="500.0" y="46.25" font-size="15" fill="#12343b" font-weight="600" text-anchor="middle">Python</text>
<rect x="585.0" y="24" width="150" height="34" rx="17.0" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<text x="660.0" y="46.25" font-size="15" fill="#12343b" font-weight="600" text-anchor="middle">an agent (MCP)</text>
<text x="24" y="170" font-size="15" fill="#4f6b70" font-weight="700" text-anchor="start" letter-spacing="1.5">YOU BRING</text>
<text x="744" y="270" font-size="15" fill="#4f6b70" font-weight="700" text-anchor="start" letter-spacing="1.5">YOU GET</text>
<rect x="24" y="190.0" width="232" height="86" rx="12" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<circle cx="44" cy="211.0" r="6" fill="#17a2a5"/>
<text x="60" y="216.0" font-size="17" fill="#12343b" font-weight="600" text-anchor="start">A model file</text>
<text x="60" y="237.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">blocks, resources,</text>
<text x="60" y="256.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">expressions, a building</text>
<rect x="24" y="290.0" width="232" height="86" rx="12" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<circle cx="44" cy="311.0" r="6" fill="#17a2a5"/>
<text x="60" y="316.0" font-size="17" fill="#12343b" font-weight="600" text-anchor="start">Your data</text>
<text x="60" y="337.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">CSV, Excel, SQL, REST,</text>
<text x="60" y="356.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">MQTT, OPC UA, Modbus</text>
<rect x="24" y="490.0" width="232" height="86" rx="12" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<circle cx="44" cy="520.5" r="6" fill="#17a2a5"/>
<text x="60" y="525.5" font-size="17" fill="#12343b" font-weight="600" text-anchor="start">A plant</text>
<text x="60" y="546.5" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">live, or a recorded log</text>
<rect x="744" y="290.0" width="232" height="86" rx="12" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<circle cx="764" cy="311.0" r="6" fill="#ffd166"/>
<text x="780" y="316.0" font-size="17" fill="#12343b" font-weight="600" text-anchor="start">Pages to share</text>
<text x="780" y="337.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">a replay, and a viewer</text>
<text x="780" y="356.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">that runs in a browser</text>
<rect x="744" y="390.0" width="232" height="86" rx="12" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<circle cx="764" cy="411.0" r="6" fill="#ffd166"/>
<text x="780" y="416.0" font-size="17" fill="#12343b" font-weight="600" text-anchor="start">Results</text>
<text x="780" y="437.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">tables, Excel, a report,</text>
<text x="780" y="456.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">law-check warnings</text>
<rect x="744" y="490.0" width="232" height="86" rx="12" fill="#ffffff" stroke="#cfdcde" stroke-width="1.2"/>
<circle cx="764" cy="511.0" r="6" fill="#ffd166"/>
<text x="780" y="516.0" font-size="17" fill="#12343b" font-weight="600" text-anchor="start">A twin's answers</text>
<text x="780" y="537.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">forecasts, scores,</text>
<text x="780" y="556.0" font-size="15" fill="#4f6b70" font-weight="400" text-anchor="start">proposals to approve</text>
<rect x="304" y="104" width="392" height="492" rx="22" fill="#12343b"/>
<text x="500.0" y="146" font-size="28" fill="#ffd166" font-weight="800" text-anchor="middle" letter-spacing="6">NAGA</text>
<text x="500.0" y="172" font-size="15" fill="#8fe3d3" font-weight="400" text-anchor="middle">the engine, built on SimPy</text>
<rect x="320" y="190" width="360" height="86" rx="14" fill="#1d4d56"/>
<text x="338" y="217" font-size="16" fill="#8fe3d3" font-weight="700" text-anchor="start">1  Check the file</text>
<text x="338" y="241" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">a versioned schema, problem codes,</text>
<text x="338" y="261" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">checks on walls and doors</text>
<rect x="320" y="290" width="360" height="86" rx="14" fill="#1d4d56"/>
<text x="338" y="317" font-size="16" fill="#8fe3d3" font-weight="700" text-anchor="start">2  Run it on one clock</text>
<rect x="325.0" y="330" width="114" height="32" rx="16.0" fill="#2a5f69"/>
<text x="382.0" y="351.075" font-size="14.5" fill="#ffffff" font-weight="600" text-anchor="middle">discrete-event</text>
<rect x="443.0" y="330" width="114" height="32" rx="16.0" fill="#2a5f69"/>
<text x="500.0" y="351.075" font-size="14.5" fill="#ffffff" font-weight="600" text-anchor="middle">system dynamics</text>
<rect x="561.0" y="330" width="114" height="32" rx="16.0" fill="#2a5f69"/>
<text x="618.0" y="351.075" font-size="14.5" fill="#ffffff" font-weight="600" text-anchor="middle">agent-based</text>
<rect x="320" y="390" width="360" height="86" rx="14" fill="#1d4d56"/>
<text x="338" y="417" font-size="16" fill="#8fe3d3" font-weight="700" text-anchor="start">3  Turn runs into evidence</text>
<text x="338" y="441" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">replications with intervals,</text>
<text x="338" y="461" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">scenarios, DOE, optimisation</text>
<rect x="320" y="490" width="360" height="86" rx="14" fill="#1d4d56"/>
<text x="338" y="517" font-size="16" fill="#8fe3d3" font-weight="700" text-anchor="start">4  Follow a plant</text>
<text x="338" y="541" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">start from the plant's state now,</text>
<text x="338" y="561" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">forecast, score, propose</text>
<path d="M493.0 280 L500.0 287 L507.0 280" fill="none" stroke="#8fe3d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M493.0 380 L500.0 387 L507.0 380" fill="none" stroke="#8fe3d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
