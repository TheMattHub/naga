<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A model with its building, data and a plant go into the Naga engine; results, pages and 3D scenes to share and a twin's answers come out; it is driven from the command line, from Python or by an agent">
