<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="How the Naga engine works. You bring a model file, your data and a live plant. The engine checks the file against its schema; runs discrete-event, system dynamics and agent-based methods in one model; proves results with replications, scenarios and designed experiments; and follows a live plant to forecast it. You get results, web pages and forecasts. Underneath is SimPy: one clock for all three methods.">
<title>How the Naga engine works</title>
