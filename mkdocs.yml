site_name: Naga
site_description: A simulation engine for Python, built on SimPy
site_url: https://thematthub.github.io/naga/
# No repo_url: with one the theme asks api.github.com for the repository's numbers on every
# page. The landing page links the repository instead.
docs_dir: docs
site_dir: site
# Links name the .html file itself, so the built site also opens from disk (a CI
# artifact). Search needs a server either way: `mkdocs serve`, or the hosted site.
use_directory_urls: false

theme:
  name: material
  logo: img/naga.svg
  favicon: img/naga.svg
  # System fonts: the theme's default asks Google Fonts for two families on every page.
  font: false
  # The scheme follows the reader's system. A light page in a dark browser flashed black
  # between two pages, the browser's own background showing while the next one loaded.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.indexes
    - content.code.copy

plugins:
  - search
  # A page that moved keeps its old address working. One map, for every move.
  - redirects:
      redirect_maps:
        reference/api.md: reference/api/index.md
        reference-models.md: validation/reference-models.md
        reference/cli.md: reference/cli/index.md
  # The API reference is the docstrings, read statically (no import of nagasim at build time).
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            members_order: source

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  # The changelog and contributing pages include the repository's own files.
  - pymdownx.snippets:
      check_paths: true
  # The gallery's flow diagrams are Mermaid text; the theme draws them in the browser.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  # llms-full.txt and a Markdown copy of every page, written at build time.
  - hooks/llm_copies.py

# tools/gen_engine_docs.py reads this nav to write docs/llms.txt: every page is listed here.
